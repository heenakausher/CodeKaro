<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dribbble</title>
    <link href="./output.css" rel="stylesheet">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    </style>
</head>
<body class="m-0 p-0 h-screen">
    <section class="container flex">
        <div class="left flex-[70%] font-arial">
            <div class="logo mt-9 cursor-pointer"> 
                <svg xmlns="http://w3.org" viewBox="0 0 300 120" width="140" height="50" letter-spacing="2px" ; ><style>.brand-text {font-family: "Billabong", "Pacifico", "Brush Script MT", "Segoe Script", cursive; font-size: 55px; letter-spacing: 5px; fill: #0d0c22;}</style><g transform="rotate(-3)"><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="brand-text">Dribbble</text></g>
                </svg>
            </div>
            <div class="card1 flex justify-center mt-8 mx:auto"><img class="h-14 w-auto" src="ball.PNG"></div>
            <div class="card2 text-[23px] font-bold mt-3 m-2.5 text-center"><h1>Welcome to Dribbble</h1></div>
            <div class="card3 flex text-[14px] my-2.5 mx-auto w-75 text-center mb-5">Create your account and discover world-class design talent.</div>
            <button class="card4 flex text-[14px] font-semibold text-gray-800 my-2.5 mx-auto gap-20 p-3 rounded-[50px] w-87.5 bg-white border border-gray-300 cursor-pointer hover:bg-[#F0F4FF]">
                <img src="google-logo.svg" class="h-5 w-auto">
                Continue with Google</button>
            <div class="card5 text-[14px] text-gray-500 m-2.5 text-center mt-5 mb-5">or</div>
            <div class="card6 text-[14px] my-2.5 mx-auto p-3 rounded-lg border border-gray-300 w-87.5 mb-7.5 hover:border-gray-400"><input class="border-none" type="text" placeholder="Enter email address"></div>
            <button class="card7 flex text-[14px] font-semibold my-2.5 mx-auto p-3 rounded-[50px] w-87.5 bg-black text-white justify-center mb-5.5 hover:bg-gray-900">Continue</button>
            <div class="card8 text-[13px] m-2.5 text-gray-500 text-center mb-5.5">By continuing, you agree to our Terms and Privacy Policy.</div>
            <div class="card9 text-[13px] m-2.5 text-gray-500 text-center">Already have an account? Sign in</div>
        </div>
        <div class="right flex-[30%] object-contain">
            <video class="video w-full h-screen object-cover" src="mush.mp4" autoplay muted loop></video>
        </div>
    </section>
</body>

</html>
