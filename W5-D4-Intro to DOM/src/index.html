<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="m-auto h-auto">
    <div class="flex flex-col text-gray-600 font-semibold font-arial border border-neutral-300 items-center justify-center my-[2%] m-auto w-150 h-auto rounded-xl">
        <div class="Top&Checkbox w-[90%] mt-[5%]">
            <div class="flex justify-between">
                <p>Sex</p>
                <div class="flex justify-between gap-3 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pin" viewBox="0 0 16 16">
                    <path d="M4.146.146A.5.5 0 0 1 4.5 0h7a.5.5 0 0 1 .5.5c0 .68-.342 1.174-.646 1.479-.126.125-.25.224-.354.298v4.431l.078.048c.203.127.476.314.751.555C12.36 7.775 13 8.527 13 9.5a.5.5 0 0 1-.5.5h-4v4.5c0 .276-.224 1.5-.5 1.5s-.5-1.224-.5-1.5V10h-4a.5.5 0 0 1-.5-.5c0-.973.64-1.725 1.17-2.189A6 6 0 0 1 5 6.708V2.277a3 3 0 0 1-.354-.298C4.342 1.674 4 1.179 4 .5a.5.5 0 0 1 .146-.354m1.58 1.408-.002-.001zm-.002-.001.002.001A.5.5 0 0 1 6 2v5a.5.5 0 0 1-.276.447h-.002l-.012.007-.054.03a5 5 0 0 0-.827.58c-.318.278-.585.596-.725.936h7.792c-.14-.34-.407-.658-.725-.936a5 5 0 0 0-.881-.61l-.012-.006h-.002A.5.5 0 0 1 10 7V2a.5.5 0 0 1 .295-.458 1.8 1.8 0 0 0 .351-.271c.08-.08.155-.17.214-.271H5.14q.091.15.214.271a1.8 1.8 0 0 0 .37.282"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                    <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </div>
            </div>
            <label class="flex my-3 gap-3 cursor-pointer"><input id="Gender" type="radio" Name="Gender" value="Female">Female</label>
            <label class="flex my-3 gap-3 cursor-pointer"><input id="Gender" type="radio" Name="Gender" value="Male">Male</label>
        </div>

        <div class="Height w-[90%] mt-[1%]">
            <div class="flex justify-between mb-2">
                <p>Height</p>
                <div class="flex justify-between gap-3 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pin" viewBox="0 0 16 16">
                    <path d="M4.146.146A.5.5 0 0 1 4.5 0h7a.5.5 0 0 1 .5.5c0 .68-.342 1.174-.646 1.479-.126.125-.25.224-.354.298v4.431l.078.048c.203.127.476.314.751.555C12.36 7.775 13 8.527 13 9.5a.5.5 0 0 1-.5.5h-4v4.5c0 .276-.224 1.5-.5 1.5s-.5-1.224-.5-1.5V10h-4a.5.5 0 0 1-.5-.5c0-.973.64-1.725 1.17-2.189A6 6 0 0 1 5 6.708V2.277a3 3 0 0 1-.354-.298C4.342 1.674 4 1.179 4 .5a.5.5 0 0 1 .146-.354m1.58 1.408-.002-.001zm-.002-.001.002.001A.5.5 0 0 1 6 2v5a.5.5 0 0 1-.276.447h-.002l-.012.007-.054.03a5 5 0 0 0-.827.58c-.318.278-.585.596-.725.936h7.792c-.14-.34-.407-.658-.725-.936a5 5 0 0 0-.881-.61l-.012-.006h-.002A.5.5 0 0 1 10 7V2a.5.5 0 0 1 .295-.458 1.8 1.8 0 0 0 .351-.271c.08-.08.155-.17.214-.271H5.14q.091.15.214.271a1.8 1.8 0 0 0 .37.282"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                    <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </div>
            </div>
            <div class="flex justify-between border w-full rounded-sm h-10 text-black bg-blue-50 border-blue-200 hover:border-blue-400 hover:ring-4 hover:ring-blue-50 hover:outline-0 hover:bg-white">
                <input id="Height" class="outline-0 mx-2 w-full" type="text" >
                <select id="HeightUnit" class="cursor-pointer text-[13px] outline-0 text-blue-600 hover:bg-neutral-200">
                    <option value="meters/centimeters(m/cm)">meters/centimeters(m/cm)</option>
                    <option value="centimeters(cm)">centimeters(cm)</option>
                    <option value="meters(m)">meters(m)</option>
                    <option value="inches(in)">inches(in)</option>
                    <option value="feet(ft)">feet(ft)</option>
                    <option value="feet/inches(ft/in)">feet/inches(ft/in)</option>
                </select>
            </div>
        </div>

        <div class="Weight w-[90%] mt-[3%]">
            <div class="flex justify-between mb-2">
                <p>Weight</p>
                <div class="cursor-pointer flex justify-between gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                    <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </div>
            </div>
            <div class="flex justify-between border w-full rounded-sm h-10 text-black bg-blue-50 border-blue-200 hover:border-blue-400 hover:ring-4 hover:ring-blue-50 hover:outline-0 hover:bg-white">
                <input id="Weight" class="outline-0 mx-2 w-full" type="text" >
                <select id="WeightUnit" class="cursor-pointer text-[13px] outline-0 text-blue-600 hover:bg-neutral-200">
                    <option value="kilograms(kg)">kilograms(kg)</option>
                    <option value="pounds(lb)">pounds(lb)</option>
                    <option value="stones(st)">stones(st)</option>
                </select>
            </div>
        </div>

        <div class="BMI w-[90%] mt-[3%]">
            <div class="flex justify-between mb-2">
                <p>BMI</p>
                <div class="cursor-pointer flex justify-between gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                    <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </div>
            </div>
            <input id="BMI" type="text" class="outline-0 w-full flex justify-between border rounded-sm h-10 text-black bg-blue-50 border-blue-200 hover:border-blue-400 hover:ring-4 hover:ring-blue-50 hover:outline-0 hover:bg-white">
        </div>

        <div class="BMI-Prime w-[90%] mt-[3%] mb-[4%]">
            <div class="flex justify-between mb-2">
                <p id="BMIPrimeInfo" onclick="bmiprimeinfo()" class=" cursor-pointer hover:text-orange-500 flex items-center gap-1">BMI Prime
                    <svg class="text-gray-500 hover:text-orange-500" width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <rect width="24" height="24" fill="white"></rect> <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></circle> 
                    <path d="M12 11V17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M11.75 8V7H12.25V8H11.75Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path> </g>
                    </svg>
                </p>
                <div class="cursor-pointer flex justify-between gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                    <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </div>
            </div>
            <input id="BMIPrime" class="outline-0 w-full flex justify-between border rounded-sm h-10 text-black bg-blue-50 border-blue-200 hover:border-blue-400 hover:ring-4 hover:ring-blue-50 hover:outline-0 hover:bg-white"" type="text" >
            
        </div>

        <button onclick="calculate()" id="btn" class="cursor-pointer text-blue-600 bg-white border rounded-2xl px-2 py-1 my-4 text-[14px] hover:bg-blue-200">Calculate</button>







    </div>
    <div id="Category" class="text-center mt-2 font-semibold"></div>
    <div id="WeightLoss" class="text-center mt-2 text-gray-600"></div>
    <script src="app.js"></script>
</body>
</html>
