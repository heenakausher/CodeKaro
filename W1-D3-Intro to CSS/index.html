<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dribbble</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    </style>
    <link rel="stylesheet" href="dribbble.css">
</head>

<body>
<div class="header">

    <div class="logo"> 
        <p>Dribbble</p>
    </div>

    <div class="searchbox">
        <input type="text" placeholder="What are you looking for?">
        <select>
            <option value="Shots">Shots</option>
            <option value="Designers">Designers</option>
            <option value="Services">Services</option>
        </select>
        <img src="magnifying-glass-svgrepo-com.svg" alt="searchicon" height="40px">
    </div>
    
    <div class="options">
    <select >
        <option value="Explore">Explore</option>
        <option value="Popular">Popular</option>
        <option value="New and Noteworthy">New and Noteworthy</option>
        <option value="Product Design">Product Design</option>
        <option value="Web Design">Web Design</option>
        <option value="Animation">Animation</option>
        <option value="Branding">Branding</option>
        <option value="Illustration">Illustration</option>
        <option value="Mobile">Mobile</option>
        <option value="Typography">Typography</option>
        <option value="Print">Print</option>
    </select>

    <select >
        <option value="Hire Talent">Hire Talent</option>
        <option value="Start Project Brief">Start Project Brief</option>
        <option value="Browse Profiles">Browse Profiles</option>
        <option value="Explore Services">Explore Services</option>
    </select>

    <select >
        <option value="Get Hired">Get Hired</option>
        <option value="Browse Project Brief">Browse Project Brief</option>
        <option value="Send Outbound Proposal">Send Outbound Proposal</option>
        <option value="Add Service">Add Service</option>
    </select>

    <select >
        <option value="Community">Community</option>
        <option value="Blog">Blog</option>
        <option value="Playoffs">Playoffs</option>
        <option value="Help Center">Help Center</option>
    </select>
    </div>

    <button class="button1">Sign up</button>
    <button class="button2">Log in</button>
    
</div>

<div class="discount">
<p>Get 20% off your first payment for design and development services on Dribbble.
Use code WELCOME20🎉</p>
<button class="button3">Get Started</button>
</div>

<div class="card1"><img src="ball.PNG"></div>

<div class="card2"><h1>Welcome to Dribbble</h1></div>

<div class="card3">Create your account and discover world-class design talent.</div>

<button class="card4">
    <img src="google-logo.svg" height="14">
    Continue with Google</button>

<div class="card5">or</div>

<div class="card6"><input type="text" placeholder="Enter email address"></div>

<button class="card7">Continue</button>

<div class="card8">By continuing, you agree to our Terms and Privacy Policy.</div>

<div class="card9">Already have an account? Sign in</div>

</body>
</html>
